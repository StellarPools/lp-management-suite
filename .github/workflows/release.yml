# Release workflow — tag-triggered build, test, and artifact upload.
# Triggered by a semver tag push (e.g. v0.1.0).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release-contracts:
    name: Build and upload contract WASM artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli

      - name: Build contracts
        run: |
          cd contracts
          soroban contract build

      - name: Run contract tests
        run: |
          cd contracts
          cargo test --workspace

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-${{ github.ref_name }}
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  release-sdk:
    name: Build and test SDK for release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: |
          cd sdk
          npm install

      - name: Build SDK
        run: |
          cd sdk
          npm run build

      - name: Run SDK unit tests
        run: |
          cd sdk
          npm test

      - name: Upload SDK dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist-${{ github.ref_name }}
          path: sdk/dist/
          if-no-files-found: error

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [release-contracts, release-sdk]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm-${{ github.ref_name }}
          path: artifacts/wasm/

      - name: Download SDK dist
        uses: actions/download-artifact@v4
        with:
          name: sdk-dist-${{ github.ref_name }}
          path: artifacts/sdk/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wasm/*.wasm
          generate_release_notes: true
