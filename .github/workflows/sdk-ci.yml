# SDK CI — build, test, and lint the TypeScript SDK.
# Runs the commands documented in README.md "Testing > SDK Tests".
name: SDK CI

on:
  push:
    branches: ["**"]
    paths:
      - "sdk/**"
      - "keeper/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "keeper/**"
      - ".github/workflows/sdk-ci.yml"

jobs:
  build-and-test:
    name: Build, test, and lint SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # README requires Node.js >= 18
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        # Per README "Installation": cd sdk && npm install
        run: |
          cd sdk
          npm install

      - name: Build SDK
        run: |
          cd sdk
          npm run build

      - name: Run SDK unit tests
        # Per README "Testing > SDK Tests": npm test
        # Integration tests are excluded — they require a live Testnet deployment.
        run: |
          cd sdk
          npm test

      - name: Lint SDK
        # Per README "Testing > SDK Tests": npm run test:lint
        run: |
          cd sdk
          npm run test:lint

  build-keeper:
    name: Build keeper service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK dependencies (keeper depends on local SDK)
        run: |
          cd sdk
          npm install

      - name: Install keeper dependencies
        run: |
          cd keeper
          npm install

      - name: Build keeper
        run: |
          cd keeper
          npm run build
