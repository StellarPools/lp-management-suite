<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LP Management Suite — Dashboard</title>
  <style>
    body { font-family: monospace; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h1   { font-size: 1.3rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    button {
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      border: 1px solid #555;
      border-radius: 4px;
      background: #f5f5f5;
      font-family: monospace;
    }
    button:hover { background: #e0e0e0; }
    #output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 4px;
      min-height: 200px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.85rem;
    }
    .note { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>LP Management Suite — Dashboard</h1>
  <p class="note">
    Minimal front-end wiring.  Set <code>VITE_CONTRACT_ID</code>,
    <code>VITE_ACCOUNT</code>, and provide a real <code>signTransaction</code>
    callback in <code>src/main.ts</code> before connecting to a live network.
  </p>

  <div class="controls">
    <button id="btn-deposit">deposit</button>
    <button id="btn-withdraw">withdraw</button>
    <button id="btn-rebalance">rebalance</button>
    <button id="btn-compound">compound</button>
    <button id="btn-yields">compareYields</button>
    <button id="btn-health">getPositionHealth</button>
    <button id="btn-subscribe">onAlert (subscribe)</button>
    <button id="btn-unsubscribe">onAlert (unsubscribe)</button>
    <button id="btn-export">exportHistoryCsv</button>
  </div>

  <pre id="output">Click a button to call the corresponding SDK method…</pre>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
